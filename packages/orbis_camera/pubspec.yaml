name: orbis_camera
description: >-
  Cameras as shots rather than as objects. A camera describes what it wants to
  frame; the engine works out where to be and blends between them.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  vector_math: ^2.1.4

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
