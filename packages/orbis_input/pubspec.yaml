name: orbis_input
description: >-
  Gamepads as state a frame can ask about, and as the handful of things that
  happened between two frames. Dead zones, curves and layouts belong to the
  engine rather than to every game written against it.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  vector_math: ^2.1.4

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
