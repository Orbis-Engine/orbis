name: orbis_net_dashwire
description: >-
  Carries Orbis replication over dashwire, so a session gets sockets,
  reliability and handshake without Orbis owning any of them.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  dashwire: ^0.1.0
  orbis_net:
    path: ../orbis_net

dev_dependencies:
  lints: ^5.0.0
  orbis_core:
    path: ../orbis_core
  test: ^1.25.0
